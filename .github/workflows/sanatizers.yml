name: Sanatizers

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  sanatizers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The commit message check needs more than the tip commit.
          fetch-depth: 0

      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyflakes python3-pycodestyle \
            pycodestyle radon shellcheck

      - name: Run sanatizers
        run: ./.github/scripts/run-all-sanatizers
