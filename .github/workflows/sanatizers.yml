# One job, running .github/scripts/run-all-sanatizers, which is the
# same command a developer runs before committing:
#
#   radon        no block rated C or worse, so functions stay small
#   pycodestyle  PEP 8 with its defaults, so Python wraps at 79 columns
#   pyflakes     no unused imports, names or shadowing
#   shellcheck   every *.sh and shebang script, these scripts included
#   commit msgs  "<scope>: <Summary>" subjects, and a Change-type line
#

name: Sanatizers

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  sanatizers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The commit message check needs more than the tip commit.
          fetch-depth: 0

      - name: Install requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyflakes python3-pycodestyle \
            pycodestyle radon shellcheck

      - name: Run sanatizers
        run: ./.github/scripts/run-all-sanatizers
