# Three jobs, in order of what they cost:
#
#   pytest    the suite on every supported Python. Fast, no container:
#             the action only ever reads INPUT_* variables, so a test
#             can drive it in process.
#   image     builds the image and runs the tests marked "docker",
#             which drive the action the way GitHub drives it. Those
#             tests skip themselves everywhere else, so this is the
#             only job that really executes them.
#   coverage  the suite once more, for the report and the floor.
#
# The linters live in sanatizers.yml, not here.

name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package
        run: pip install -e ".[test]"

      # The docker tests skip here: nothing built an image.
      - name: Run pytest
        run: pytest -v

  # Kept out of the matrix above: what this proves is the image, not
  # the runner's interpreter, so building it three times buys nothing.
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package
        run: pip install -e ".[test]"

      # tests/test_image.py looks for exactly this tag.
      - name: Build the image
        run: docker build -t lab-moonforge-action:ci .

      # The tests shell out to $CONTAINER_ENGINE, podman by default
      # because that is what works on a developer's machine here.
      - name: Run the action inside it
        run: pytest -m docker -v
        env:
          CONTAINER_ENGINE: docker

  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package
        run: pip install -e ".[test]"

      # The source and the floor come from pyproject.
      - name: Run pytest with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

      # Reporting only: the gate is --cov-fail-under above.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
