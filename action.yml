name: 'lab-moonforge-action'
description: 'Run a Moonforge test suite in a container, optionally on a lab device'

inputs:
  entrypoint:
    description: 'What to run: a test path for the pytest runner, or a program for the command runner'
    required: true
  args:
    description: 'Arguments for the entry point, any number of them, split the way a shell would split them'
    required: false
    default: ''
  runner:
    description: 'How to run the entry point: pytest or command'
    required: false
    default: 'pytest'
  workdir:
    description: 'Directory in the checkout the tests live in; the entry point runs from here'
    required: false
    default: '.'
  outdir:
    description: 'Directory for reports and artifacts, relative to workdir'
    required: false
    default: 'test-results'
  env:
    description: 'One NAME=VALUE per line, exported to the entry point'
    required: false
    default: ''

outputs:
  outdir:
    description: 'Output directory, relative to the workspace root, ready to hand to upload-artifact'
  exit_code:
    description: 'Exit status of the entry point'

runs:
  using: docker
  image: docker://ghcr.io/moonforgelinux/lab-moonforge-action:0.1.0
