name: 'lab-moonforge-action'
description: 'Run a Moonforge test suite in a container, optionally on a lab device'

inputs:
  # Not `entrypoint` or `args`: GitHub reserves both inside `with:` for
  # container actions, and uses them for the docker run itself.
  run:
    description: 'What to run: a test path for the pytest runner, or a program for the command runner'
    required: true
  run_args:
    description: 'Arguments for it, any number of them, split the way a shell would split them'
    required: false
    default: ''
  runner:
    description: 'How to run it: pytest or command'
    required: false
    default: 'pytest'
  workdir:
    description: 'Directory in the checkout the tests live in; the run happens from here'
    required: false
    default: '.'
  outdir:
    description: 'Directory for reports and artifacts, relative to workdir'
    required: false
    default: 'test-results'
  env:
    description: 'One NAME=VALUE per line, exported to the entry point'
    required: false
    default: ''

  # --- lab hardware. Leave dut_pool empty to run on the runner itself.
  dut_pool:
    description: 'dut-control pool to reserve a device from. Setting it wraps the run in the lab lifecycle. A specific device is addressed by giving it a pool of its own in the lab configuration'
    required: false
    default: ''
  dut_control_url:
    description: 'Base URL of the dut-control service'
    required: false
    default: ''
  dut_control_client_key:
    description: 'dut-control client key; required whenever dut_pool is set'
    required: false
    default: ''
  dut_image:
    description: 'Image to flash before the tests, relative to workdir. Left empty, the device is used as it is'
    required: false
    default: ''

outputs:
  outdir:
    description: 'Output directory, relative to the workspace root, ready to hand to upload-artifact'
  exit_code:
    description: 'Exit status of what was run'

runs:
  using: docker
  # Built per job until there is a release to point at. Swap this for
  # docker://ghcr.io/moonforgelinux/lab-moonforge-action:X.Y.Z once the
  # first tag has pushed one.
  image: Dockerfile
