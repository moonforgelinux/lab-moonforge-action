[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-moonforge-action"
description = "Run Moonforge test suites on a dut-control lab device"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dynamic = ["version"]

authors = [
  { name = "Igalia S.L." }
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
]

# Nothing at run time: the lab is driven through the dut-control-client CLI,
# so every step stays reproducible by hand.
dependencies = []

[project.urls]
Homepage = "https://github.com/moonforgelinux/lab-moonforge-action"
Source = "https://github.com/moonforgelinux/lab-moonforge-action.git"

[project.scripts]
lab-moonforge-action = "lab_action.main:main"

[project.optional-dependencies]
# What the image carries for the suites themselves. Retries and
# timeouts earn their place against flaky hardware; xdist does not,
# since a single device is serial.
suite = [
  "pytest>=7.0",
  "pytest-rerunfailures>=12.0",
  "pytest-timeout>=2.1",
]
# The second image only. Pulls the whole imaging stack behind it.
robot = [
  "robotframework>=6.0",
  "robotframework-doctestlibrary>=0.33",
]
test = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pyyaml>=6.0",
]
lint = [
  "pycodestyle",
  "pyflakes",
  "radon",
]

[tool.setuptools]
packages = ["lab_action"]

[tool.setuptools.dynamic]
version = { attr = "lab_action.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "lifecycle: runs the action against the dut-control stub",
  "docker: runs the built container image",
]

[tool.coverage.run]
source = ["lab_action"]
# The lifecycle tests drive the action as a subprocess, the way the
# container does. conftest points those at this file so their coverage
# is recorded too, and parallel keeps the data files from colliding.
parallel = true

[tool.coverage.report]
# A floor, not a target. Raise it as the real shape of the code settles.
fail_under = 90
show_missing = true
